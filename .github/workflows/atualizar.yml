name: Atualizar dados da Caixa

# Só roda quando alguém dispara manualmente (botão "Atualizar dados" no mapa ou aba Actions do GitHub).
on:
  workflow_dispatch:

concurrency:
  group: atualizar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Baixar CSVs, gerar index.html e publicar
        run: python -I atualizar.py

      - name: Pedir rebuild do Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
